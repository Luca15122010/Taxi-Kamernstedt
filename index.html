<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fahrzeuge & Lager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Fahrzeuge & Lager</h1>
      <p>Übersicht über Inhalt und Menge in jedem Fahrzeug oder Lager.</p>
    </header>

    <main class="grid">
      <section class="card">
        <h2>Fahrzeug 1</h2>
        <label>Was ist drin?</label>
        <textarea placeholder="z. B. Werkzeug, Material, Boxen"></textarea>

        <label>Menge</label>
        <input type="text" placeholder="z. B. 12 Stück" />

        <button type="button">Speichern</button>
      </section>

      <section class="card">
        <h2>Fahrzeug 2</h2>
        <label>Was ist drin?</label>
        <textarea placeholder="z. B. Schläuche, Kabel, Geräte"></textarea>

        <label>Menge</label>
        <input type="text" placeholder="z. B. 8 Stück" />

        <button type="button">Speichern</button>
      </section>

      <section class="card">
        <h2>Lager 1</h2>
        <label>Was ist drin?</label>
        <textarea placeholder="z. B. Ersatzteile, Kartons, Zubehör"></textarea>

        <label>Menge</label>
        <input type="text" placeholder="z. B. 50 Stück" />

        <button type="button">Speichern</button>
      </section>
    </main>
  </div>
</body>
</html>
