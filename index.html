<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fahrzeuge & Lager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="background"></div>

  <div class="container">
    <header class="hero">
      <div class="badge">Inventarübersicht</div>
      <h1>Fahrzeuge & Lager</h1>
      <p>Verwalte Inhalte, Mengen und Bestände übersichtlich in einzelnen Karten.</p>
    </header>

    <main class="grid">
      <section class="card">
        <div class="card-head">
          <h2>Fahrzeug 1</h2>
          <span class="tag">Aktiv</span>
        </div>

        <label>Was ist drin?</label>
        <textarea placeholder="z. B. Werkzeug, Material, Kisten"></textarea>

        <label>Menge</label>
        <input type="text" placeholder="z. B. 12 Stück" />

        <button type="button">Speichern</button>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Fahrzeug 2</h2>
          <span class="tag">Bereit</span>
        </div>

        <label>Was ist drin?</label>
        <textarea placeholder="z. B. Kabel, Geräte, Zubehör"></textarea>

        <label>Menge</label>
        <input type="text" placeholder="z. B. 8 Stück" />

        <button type="button">Speichern</button>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Lager 1</h2>
          <span class="tag">Bestand</span>
        </div>

        <label>Was ist drin?</label>
        <textarea placeholder="z. B. Ersatzteile, Boxen, Kartons"></textarea>

        <label>Menge</label>
        <input type="text" placeholder="z. B. 50 Stück" />

        <button type="button">Speichern</button>
      </section>
    </main>
  </div>
</body>
</html>
